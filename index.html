<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1F3A6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de tareas por turno — HTP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3A6E; --navy-deep:#14264A; --orange:#E8804A;
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#D6DDE7;
  --ink:#16223A; --ink-2:#4C5B73; --ink-3:#7D8AA0;
  --st-pend:#8A97AB; --st-proc:#2F6DB5; --st-det:#C0463A; --st-ok:#2E8656;
  --late:#E8804A; --focus:#E8804A; --nav-on:#1F3A6E; --nav-pill:rgba(232,128,74,.2);
  --radius-lg:14px; --radius:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#162238; --surface-2:#1C2B45; --line:#2A3B59;
    --ink:#E7ECF4; --ink-2:#A9B6CB; --ink-3:#7E8CA5;
    --st-pend:#7F8CA2; --st-proc:#5B93DA; --st-det:#E0695C; --st-ok:#4DB07A; --nav-on:#A9C4F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162238; --surface-2:#1C2B45; --line:#2A3B59;
  --ink:#E7ECF4; --ink-2:#A9B6CB; --ink-3:#7E8CA5;
  --st-pend:#7F8CA2; --st-proc:#5B93DA; --st-det:#E0695C; --st-ok:#4DB07A; --nav-on:#A9C4F0;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* App shell */
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{touch-action:manipulation}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px;box-shadow:0 2px 10px rgba(8,18,40,.18)}
.logo-plate{background:#fff;border-radius:8px;padding:5px 8px;display:flex;align-items:center;flex:none}
.logo-plate img{height:26px;width:auto;display:block}
.appbar-t{flex:1;min-width:0}
.appbar h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
.appbar .sub{font-size:12px;color:#C4D0E6;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.conn{background:none;border:0;cursor:pointer;padding:6px 4px}
.navbar[hidden]{display:none}
.login{max-width:420px;margin:40px auto;padding:24px}
.login h2{margin:0 0 6px;font-size:22px}
.login .field{margin:14px 0 4px;font-size:16px;padding:12px}
.conn{font-size:12px;color:#C4D0E6;display:flex;align-items:center;gap:6px;flex:none}
.conn i{width:9px;height:9px;border-radius:50%;background:#8FA0BD;display:inline-block}
.conn.ok i{background:#5BD08A;box-shadow:0 0 0 3px rgba(91,208,138,.25)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);user-select:none}
.nav-i{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.nav-ic{position:relative;display:flex;padding:4px 18px;border-radius:16px;transition:background .15s}
.nav-i svg{width:24px;height:24px}
.nav-i[aria-current="page"]{color:var(--nav-on)}
.nav-i[aria-current="page"] .nav-ic{background:var(--nav-pill)}
.badge{position:absolute;top:0;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--late);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--surface)}
.badge[hidden]{display:none}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;background:var(--orange);color:#fff;border:0;box-shadow:0 10px 24px rgba(232,128,74,.45);z-index:31;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab[hidden]{display:none}
.fab svg{width:28px;height:28px}
.fab:active,.card:active,.nav-i:active .nav-ic{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.fab:active,.card:active,.nav-i:active .nav-ic{transform:none}.nav-ic{transition:none}}
@media (min-width:900px){
  .navbar{top:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;gap:4px;padding:84px 0 16px;border-top:0;border-right:1px solid var(--line)}
  .nav-i{flex:none;padding:10px 2px}
  body{padding-left:96px}
  .fab{display:none}
}
@media (max-width:899px){.desk-only{display:none!important}}
@media (max-width:420px){.appbar .sub{display:none}.conn span{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip em{font-style:normal;opacity:.75;font-weight:500}
.m-list,.m-list.cards{display:none}
.facts .pill{white-space:normal}
@media (max-width:640px){main .filters input{flex:1 1 100%}main .filters select{flex:1 1 40%;min-width:0}}
.p-actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.p-actions .btn{flex:1 1 220px;justify-content:center;padding:12px}
.p-h{margin:20px 0 8px;font-size:15px}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600}
.person em{font-style:normal;color:var(--orange);font-size:11px}
.person small{color:var(--ink-3);font-weight:600}
.att-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.att{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);font-size:14px;font-weight:600}
.att input{width:20px;height:20px;accent-color:var(--st-ok);flex:none}
.att span{flex:1;min-width:0}
.att small{font-size:11px;color:var(--st-ok)}
.att.off{background:var(--surface-2)}
.att.off small{color:var(--st-det)}
.file-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.file-chip button{border:0;background:none;cursor:pointer;font-size:16px;color:var(--ink-2)}
.hist li.h-att::after{border-color:var(--st-ok)}
.hist li.h-ev::after{border-color:var(--orange)}
.t-proj{font-size:12px;color:var(--st-proc);font-weight:600;margin-top:1px}
.mini .pill{flex:none}
@media (max-width:520px){.mini .mini-m .bar{width:60px}}
.card.tap{cursor:pointer}
.card .ttl-row{display:flex;gap:10px;align-items:flex-start}
.card .ttl-row h4{flex:1}

main{max-width:1280px;margin:0 auto;padding:22px 20px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{padding-bottom:60px}}
.banner{background:var(--surface);border-left:4px solid var(--orange);padding:12px 16px;border-radius:var(--radius);margin-bottom:18px;color:var(--ink-2);font-size:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Section heads */
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sec-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border-radius:var(--radius-lg);padding:16px 18px;border:1px solid var(--line)}
.kpi b{display:block;font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.kpi span{color:var(--ink-2);font-size:13px;font-weight:500}
.kpi.late b{color:var(--late)}
.kpi small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}

/* Shift board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.shift{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.shift-top{display:flex;gap:14px;align-items:center;padding:16px 18px 12px}
.shift-letter{font-size:52px;font-weight:900;line-height:.85;color:var(--navy);letter-spacing:-.04em;min-width:44px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shift-letter{color:#8FB0E6}}
:root[data-theme="dark"] .shift-letter{color:#8FB0E6}
.shift-name{font-weight:700;font-size:15px}
.shift-boss{color:var(--ink-2);font-size:13px}
.shift-ops{color:var(--ink-3);font-size:12px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:0 18px}
.stack i{display:block;height:100%}
.shift-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:12px 18px 16px}
.shift-stats div{font-size:12px;color:var(--ink-2)}
.shift-stats b{display:block;font-size:20px;color:var(--ink);font-weight:700}
.shift-stats .late b{color:var(--late)}
.shift-foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--st-proc);font-weight:600;cursor:pointer;font-size:13px}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin:-8px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:700}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.mini li:first-child{border-top:0}
.mini li:hover .mini-t{text-decoration:underline}
.mini-t{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-m{font-size:12px;color:var(--ink-2);white-space:nowrap}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:6px;background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:0 6px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;font-size:14px}
.filters input{flex:1;min-width:200px}

/* Table (planilla) */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1020px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:600;padding:11px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.t-title{font-weight:600;min-width:220px}
.t-desc{color:var(--ink-3);font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{color:var(--ink-3);font-variant-numeric:tabular-nums}
.date{white-space:nowrap;font-variant-numeric:tabular-nums}
.date.late{color:var(--late);font-weight:700}
.comment{max-width:240px;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px 3px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%}
.pill.late{border-color:var(--late);color:var(--late)}
.bar{width:96px;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--st-proc)}
.pct{font-variant-numeric:tabular-nums;font-size:13px;margin-left:8px;color:var(--ink-2)}
.prio{font-size:12px;font-weight:700}
.prio.Alta{color:var(--st-det)}
.prio.Media{color:var(--ink-2)}
.prio.Baja{color:var(--ink-3)}

/* Mi turno cards */
.turn-pick{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.turn-pick button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:800;font-size:18px;cursor:pointer;min-width:64px}
.turn-pick button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.late{border-left:5px solid var(--late)}
.card h4{margin:0;font-size:16px;font-weight:700}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .btn{justify-content:center}

/* Team editor */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.team .panel label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.field{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;font-size:14px}
.op-row{display:flex;gap:6px;margin-bottom:6px}
.op-row .field{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);width:38px;cursor:pointer;color:var(--ink-2)}

/* Dialog */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 20px));max-height:calc(100dvh - 30px);box-shadow:0 20px 60px rgba(8,18,40,.35)}
dialog::backdrop{background:rgba(10,20,40,.55)}
.dlg-head{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:18px;font-weight:800;flex:1;letter-spacing:-.01em}
.dlg-head .sub{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:2px}
.dlg-body{padding:16px 20px 20px}
.close{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-2);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fl.full{grid-column:1/-1}
textarea.field{min-height:78px;resize:vertical}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.facts div{font-size:12px;color:var(--ink-2)}
.facts b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.desc{white-space:pre-wrap;color:var(--ink-2);font-size:14px;margin:0 0 14px}
.report{border:2px solid var(--navy);border-radius:12px;padding:14px;margin:6px 0 18px}
.report h4{margin:0 0 10px;font-size:15px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input[type=range]{flex:1;accent-color:var(--orange);height:28px}
.range-row output{font-weight:800;font-size:20px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:600}
.photo-drop{border:2px dashed var(--line);border-radius:var(--radius);padding:14px;text-align:center;color:var(--ink-2);font-size:14px;cursor:pointer;display:block}
.photo-drop svg{width:20px;height:20px;vertical-align:-4px;margin-right:4px}
.photo-drop:hover{border-color:var(--ink-3)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.hist{list-style:none;margin:0;padding:0;position:relative}
.hist li{position:relative;padding:0 0 16px 22px}
.hist li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.hist li:last-child::before{display:none}
.hist li::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--st-proc)}
.hist .h-meta{font-size:12px;color:var(--ink-3)}
.hist .h-line{font-size:14px;font-weight:600;margin:2px 0}
.hist .h-c{font-size:14px;color:var(--ink-2);white-space:pre-wrap;margin:2px 0 0}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.muted{color:var(--ink-3);font-size:13px}
.hint{font-size:12px;color:var(--ink-3);margin-top:4px}

.viewer{position:fixed;inset:0;background:rgba(5,10,20,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--st-det)}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}dialog[open]{animation:none}}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.toast{bottom:24px}}
@media (max-width:760px){.tbl-wrap{display:none}.m-list,.m-list.cards{display:grid}}
@media (max-width:640px){
  main{padding:16px 12px calc(110px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .board{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .filters input{min-width:0}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  dialog[open]{animation:sheet .26s ease-out}
  .dlg-head{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .dlg-body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .dlg-actions .btn{flex:1;justify-content:center;padding:12px}
  .kpi b{font-size:28px}
  .sec-head h2{font-size:19px}
}
.mine-sec{margin:22px 0 10px;font-size:16px}.mine-proj{margin:14px 0 8px;font-weight:700}.mine-proj .linkbtn{font-size:15px}
.lockbox{max-width:380px;margin:40px auto;text-align:center}.lockbox h2{margin:8px 0 4px}.lock-ic{color:var(--orange);display:flex;justify-content:center}.lock-err{color:#c0392b;font-size:14px;min-height:1.2em;margin:8px 0 0}
.pick-list{display:grid;gap:10px;margin-top:14px}.pick-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line,#d9dee7);border-radius:12px;background:var(--surface,#fff);color:inherit;font:inherit;cursor:pointer}.pick-btn:hover:not(:disabled){border-color:var(--orange)}.pick-btn:disabled{opacity:.5;cursor:default}.pick-l{flex:none;width:38px;height:38px;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.pick-t{display:flex;flex-direction:column}.pick-t small{color:var(--muted,#6b7480)}
</style>
</head>

/* ---------- Utilidades ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hoy(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtD(s){if(!s)return "—";const [y,m,d]=s.split("-");return d+"-"+m+"-"+y}
function fmtDT(iso){if(!iso)return "";const d=new Date(iso);return d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}
function diasEntre(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
function vencida(t){return t.estado!=="Completada" && t.fechaCompromiso && t.fechaCompromiso < hoy()}
function usrGet(){try{return JSON.parse(lsGet("htp_usuario")||"null")}catch(e){return null}}

function jefesLista(){return ((S.cfg||DEFAULT_CFG).turnos||[]).map(t=>({id:t.id,nombre:String(t.jefe||"").trim(),turno:t.nombre||("Turno "+t.id)}))}
function turnoOf(id){return (S.cfg||DEFAULT_CFG).turnos.find(x=>x.id===id)}
function turnoNombre(id){if(!id)return "Sin turno";const t=turnoOf(id);return t?t.nombre:("Turno "+id)}
function personas(tid){const t=turnoOf(tid);if(!t)return[];return [t.jefe,...(t.operadores||[])].filter(Boolean)}
function newId(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg,err){const el=document.getElementById("toast");el.textContent=msg;el.className="toast on"+(err?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>el.className="toast",2600)}
function folios(){const m={};[...S.tareas].sort((a,b)=>((a.folio||1e9)-(b.folio||1e9))||(a.creado||"").localeCompare(b.creado||"")).forEach((t,i)=>m[t.id]=t.folio||i+1);return m}
function pill(t){const late=vencida(t);return `<span class="pill${late?" late":""}"><i style="background:${EST_COLOR[t.estado]||"var(--st-pend)"}"></i>${esc(t.estado)}${late?" · vencida":""}</span>`}

let fdb=null, fauth=null, unsubs=[];
function applyEdit(t,n){["titulo","descripcion","turno","responsable","prioridad","fechaInicio","fechaCompromiso","estado","proyecto"].forEach(k=>{if(n[k]!=null)t[k]=n[k]});if(t.estado==="Completada"){t.avance=100;t.fechaCierre=t.fechaCierre||hoy()}else t.fechaCierre=""}
function applyReport(t,e,ids){const h={t:new Date().toISOString(),avance:+e.avance||0,estado:e.estado,comentario:e.comentario||"",por:e.por||"",fotos:ids,usuario:S.email||S.nombre||""};t.historial=t.historial||[];t.historial.push(h);t.avance=h.avance;t.estado=h.estado;if(h.comentario)t.ultimoComentario=h.comentario;if(h.estado==="Completada"){t.avance=100;t.fechaCierre=t.fechaCierre||hoy()}else t.fechaCierre="";t.actualizado=h.t}
function demoDB(){let d;try{d=JSON.parse(localStorage.getItem("htp_demo"))}catch(e){}d=d||{cfg:null,tareas:[]};d.proyectos=d.proyectos||[];d.registros=d.registros||[];return d}
function demoSave(d){try{localStorage.setItem("htp_demo",JSON.stringify(d))}catch(e){throw new Error("El almacenamiento de este navegador está lleno.")}}
function upsertLocal(t){const i=S.tareas.findIndex(x=>x.id===t.id);if(i>=0)S.tareas[i]=t;else S.tareas.push(t);render()}
function stripId(t){const o=JSON.parse(JSON.stringify(t));delete o.id;return o}
function fbErr(e){const c=(e&&e.code)||"";
  if(c.indexOf("permission-denied")>=0)return "No tienes permiso para hacer este cambio.";
  if(c.indexOf("unavailable")>=0)return "Sin conexión. Revisa tu señal e inténtalo de nuevo.";
  if(c.indexOf("resource-exhausted")>=0)return "Se alcanzó el límite diario del plan gratuito de Firebase.";
  return (e&&e.message)||"Error desconocido";}

async function saveTask(n){
  const now=new Date().toISOString();
  if(DEMO){const d=demoDB();let t=d.tareas.find(x=>x.id===n.id);
    if(!t){t={id:n.id,folio:d.tareas.reduce((m,x)=>Math.max(m,x.folio||0),0)+1,creado:now,avance:0,ultimoComentario:"",historial:[],fechaCierre:"",estado:"Pendiente"};d.tareas.push(t)}
    applyEdit(t,n);t.actualizado=now;demoSave(d);upsertLocal(t);return}
  try{
    let t=S.tareas.find(x=>x.id===n.id);
    if(t)t=JSON.parse(JSON.stringify(t));
    else{
      const folio=await fdb.runTransaction(async tx=>{const c=fdb.doc("config/contador");const s=await tx.get(c);const k=(s.exists?(s.data().n||0):0)+1;tx.set(c,{n:k});return k});
      t={id:n.id,folio:folio,creado:now,avance:0,ultimoComentario:"",historial:[],fechaCierre:"",estado:"Pendiente"};
    }
    applyEdit(t,n);t.actualizado=now;
    await fdb.collection("tareas").doc(n.id).set(stripId(t));
    upsertLocal(t);
  }catch(e){throw new Error(fbErr(e))}
}
async function deleteTask(id){
  if(DEMO){const d=demoDB();d.tareas=d.tareas.filter(t=>t.id!==id);demoSave(d)}
  else{try{const q=await fdb.collection("fotos").where("tarea","==",id).get();for(const d of q.docs)await d.ref.delete();await fdb.collection("tareas").doc(id).delete()}catch(e){throw new Error(fbErr(e))}}
  S.tareas=S.tareas.filter(x=>x.id!==id);render();
}
async function saveCfg(cfg){
  if(cfg.claveProy===undefined&&S.cfg&&S.cfg.claveProy)cfg.claveProy=S.cfg.claveProy;
  cfg.turnos.forEach(t=>{t.correo=String(t.correo||"").trim().toLowerCase()});
  if(DEMO){const d=demoDB();d.cfg=cfg;demoSave(d)}
  else{try{
    await fdb.doc("config/equipo").set(cfg);
    const want=new Set(cfg.turnos.map(t=>t.correo).filter(Boolean));
    const cur=await fdb.collection("permitidos").get();
    for(const d of cur.docs)if(!want.has(d.id))await d.ref.delete();
    for(const t of cfg.turnos)if(t.correo)await fdb.doc("permitidos/"+t.correo).set({turno:t.id});
  }catch(e){throw new Error(fbErr(e))}}
  S.cfg=cfg;draftCfg=null;render();
}
async function reportar(id,entry,fotos){
  if(DEMO){const d=demoDB();const t=d.tareas.find(x=>x.id===id);if(!t)throw new Error("La tarea ya no existe.");
    const ids=fotos.map(b64=>{const fid="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);lsSet("htp_demo_foto_"+fid,b64);return fid});
    applyReport(t,entry,ids);demoSave(d);return t}
  try{
    const ids=[];
    for(const b64 of fotos){const r=await fdb.collection("fotos").add({tarea:id,data:"data:image/jpeg;base64,"+b64,creado:new Date().toISOString(),usuario:S.email||S.nombre||""});ids.push(r.id)}
    const ref=fdb.collection("tareas").doc(id);
    return await fdb.runTransaction(async tx=>{
      const s=await tx.get(ref);if(!s.exists)throw new Error("La tarea ya no existe.");
      const t=Object.assign({id:id},s.data());applyReport(t,entry,ids);
      if(t.historial.length>80)t.historial=t.historial.slice(-80);
      tx.update(ref,{avance:t.avance,estado:t.estado,ultimoComentario:t.ultimoComentario||"",fechaCierre:t.fechaCierre||"",historial:t.historial,actualizado:t.actualizado});
      return t;
    });
  }catch(e){throw new Error(fbErr(e))}
}

async function anonIn(){try{await fauth.signInAnonymously()}catch(e){const c=(e&&e.code)||"";S.loadErr=/operation-not-allowed|admin-restricted/.test(c)?"Falta activar el ingreso anónimo en Firebase (Authentication → Método de acceso → Anónimo).":fbErr(e);setConn(false,"Sin acceso");render()}}
/* ---------- Fotos ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("No se pudo leer la imagen"));i.src=u})}
async function compress(file,max,q){
  const img=await loadImg(file);
  let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  return {canvas:c};
}
async function toB64(file){
  let max=1400,q=.8,data="";const lim=DEMO?160000:700000;
  for(let i=0;i<6;i++){const {canvas}=await compress(file,max,q);data=canvas.toDataURL("image/jpeg",q);if(data.length<lim)break;max=Math.round(max*.8);q=Math.max(.5,q-.07)}
  return data.split(",")[1];
}
async function photoSrc(id){
  if(photoCache.has(id))return photoCache.get(id);
  let src="";
  if(DEMO){const b=lsGet("htp_demo_foto_"+id);if(b)src=b.indexOf("data:")===0?b:"data:image/jpeg;base64,"+b}
  else{try{const s=await fdb.collection("fotos").doc(id).get();if(s.exists)src=s.data().data||""}catch(e){}}
  if(src)photoCache.set(id,src);return src;
}function hydratePhotos(root){
  root.querySelectorAll("img[data-ref]").forEach(async img=>{const src=await photoSrc(img.dataset.ref);if(src)img.src=src;else img.alt="Foto no disponible"});
}

/* ---------- Dashboard ---------- */
function stats(list){
  const s={total:list.length,act:0,ok:0,late:0,avg:0,porEst:{},aTiempo:0,cerr:0};
  ESTADOS.forEach(e=>s.porEst[e]=0);
  let sum=0,n=0;
  list.forEach(t=>{s.porEst[t.estado]=(s.porEst[t.estado]||0)+1;
    if(t.estado==="Completada"){s.ok++;s.cerr++;if(t.fechaCierre&&t.fechaCompromiso&&t.fechaCierre<=t.fechaCompromiso)s.aTiempo++}
    else{s.act++;sum+=(+t.avance||0);n++}
    if(vencida(t))s.late++;});
  s.avg=n?Math.round(sum/n):0;
  s.cumpl=s.cerr?Math.round(s.aTiempo/s.cerr*100):null;
  return s;
}
function stackBar(s){
  if(!s.total)return `<div class="stack" aria-hidden="true"></div>`;
  return `<div class="stack" role="img" aria-label="${ESTADOS.map(e=>e+": "+s.porEst[e]).join(", ")}">${ESTADOS.map(e=>s.porEst[e]?`<i style="width:${s.porEst[e]/s.total*100}%;background:${EST_COLOR[e]}"></i>`:"").join("")}</div>`;
}

  const lates=all.filter(vencida).sort((a,b)=>a.fechaCompromiso.localeCompare(b.fechaCompromiso));
  const recientes=all.filter(t=>t.historial&&t.historial.length).map(t=>({t,h:t.historial[t.historial.length-1]})).sort((a,b)=>(b.h.t||"").localeCompare(a.h.t||"")).slice(0,6);
  let h=`<div class="sec-head"><div><h2>Estado general</h2><p>Actualizado al ${fmtD(today)}. Las cifras corresponden a tareas; los proyectos se ven en su propio panel.</p></div>
  <div class="actions">${S.canEdit?`<button class="btn primary desk-only" data-act="new">${ico("plus")}Nueva tarea</button>`:""}<button class="btn" data-act="xlsx">${ico("down")}Descargar Excel</button></div></div>`;
  h+=`<div class="kpis">
    <div class="kpi"><b>${st.act}</b><span>Tareas abiertas</span><small>${st.total} tareas registradas</small></div>
    <div class="kpi"><b>${st.avg}%</b><span>Avance promedio</span><small>de las tareas abiertas</small></div>
    <div class="kpi late"><b>${st.late}</b><span>Vencidas</span><small>compromiso ya pasó sin cierre</small></div>
    <div class="kpi"><b>${st.ok}</b><span>Completadas</span><small>${st.cumpl==null?"sin cierres aún":st.cumpl+"% cerradas a tiempo"}</small></div>
  </div>`;
  h+=`<div class="legend">${ESTADOS.map(e=>`<span><i style="background:${EST_COLOR[e]}"></i>${e} (${st.porEst[e]})</span>`).join("")}</div>`;
  h+=`<div class="board">`+cfg.turnos.map(tr=>{
    const l=all.filter(t=>t.turno===tr.id),s=stats(l),ops=(tr.operadores||[]).filter(Boolean);
    return `<article class="shift">

      <div class="shift-ops">${ops.length?ops.length+" operadores mantenedores":"Sin operadores cargados"}</div></div></div>
      ${stackBar(s)}
      <div class="shift-stats"><div><b>${s.act}</b>abiertas</div><div><b>${s.avg}%</b>avance</div><div class="${s.late?"late":""}"><b>${s.late}</b>vencidas</div></div>
      <div class="shift-foot"><span class="muted">${s.ok} completadas</span><button class="linkbtn" data-goturno="${esc(tr.id)}">Ver tareas</button></div>
    </article>`}).join("")+`</div>`;
  const li=t=>`<li data-open="${esc(t.id)}"><span class="tag">${esc(t.turno||"—")}</span><span class="mini-t">N° ${F[t.id]} ${esc(t.titulo)}</span><span class="mini-m">${fmtD(t.fechaCompromiso)}</span></li>`;
  const pa=S.proyectos.filter(p=>p.estado!=="Cerrado");
  if(pa.length)h+=`<section class="panel" style="margin-bottom:14px"><h3>Proyectos en curso</h3><ul class="mini">${pa.slice(0,8).map(p=>{const s=pStats(p);return `<li data-proj="${esc(p.id)}"><span class="mini-t">${esc(p.nombre)}</span>${pPill(p)}<span class="mini-m">${bar(s.avTot)}</span></li>`}).join("")}</ul></section>`;
  h+=`<div class="two">
    <section class="panel"><h3>Vencidas sin cerrar</h3>${lates.length?`<ul class="mini">${lates.slice(0,8).map(li).join("")}</ul>`:`<p class="empty">No hay compromisos vencidos.</p>`}</section>

    <section class="panel"><h3>Últimos reportes de avance</h3>${recientes.length?`<ul class="mini">${recientes.map(({t,h})=>`<li data-open="${esc(t.id)}"><span class="tag">${esc(t.turno||"—")}</span><span class="mini-t">${esc(t.titulo)} <span class="muted">${h.avance}%${h.fotos&&h.fotos.length?" · "+h.fotos.length+" foto"+(h.fotos.length>1?"s":""):""}</span></span><span class="mini-m">${fmtDT(h.t)}</span></li>`).join("")}</ul>`:`<p class="empty">Los reportes de los jefes de turno aparecerán aquí.</p>`}</section>
  </div>`;
  if(!all.length)h+=`<p class="banner" style="margin-top:18px">Aún no hay tareas. ${S.canEdit?"Usa “Nueva tarea” para cargar la primera y asignarla a un turno.":"El jefe de operaciones cargará las tareas."}</p>`;
  return h;
}

/* ---------- Proyectos ---------- */
const P_ESTADOS=["Planificado","En ejecución","Detenido","Cerrado"];
const P_COLOR={"Planificado":"var(--st-pend)","En ejecución":"var(--st-proc)","Detenido":"var(--st-det)","Cerrado":"var(--st-ok)"};
function proyOf(id){return id?S.proyectos.find(p=>p.id===id):null}
function personasProy(pid){const p=proyOf(pid);if(!p)return[];return [...new Set([p.responsable,...(p.equipo||[])].filter(Boolean))]}
function sueltas(){return S.tareas.filter(t=>!(t.proyecto&&proyOf(t.proyecto)))}
function deProyectos(){return S.tareas.filter(t=>t.proyecto&&proyOf(t.proyecto))}
function tareasDe(pid){return S.tareas.filter(t=>t.proyecto===pid)}
function regsDe(pid){return S.registros.filter(r=>r.proyecto===pid).sort((a,b)=>((b.fecha||"")+(b.creado||"")).localeCompare((a.fecha||"")+(a.creado||"")))}
function pStats(p){
  const l=tareasDe(p.id);const s=stats(l);
  if(l.length)s.avTot=Math.round(l.reduce((a,t)=>a+(t.estado==="Completada"?100:(+t.avance||0)),0)/l.length);
  else{const ev=regsDe(p.id).find(r=>r.tipo==="evidencia"&&r.avance!=null&&r.avance!=="");s.avTot=ev?+ev.avance:(p.estado==="Cerrado"?100:0)}
  return s;
}
function pLate(p){return p.estado!=="Cerrado"&&p.fechaTermino&&p.fechaTermino<hoy()}
function pPill(p){const late=pLate(p);return `<span class="pill${late?" late":""}"><i style="background:${P_COLOR[p.estado]||"var(--st-pend)"}"></i>${esc(p.estado||"Planificado")}${late?" · atrasado":""}</span>`}
function todasPersonas(){return [...new Set((S.cfg||DEFAULT_CFG).turnos.flatMap(t=>[t.jefe,...(t.operadores||[])]).filter(Boolean))]}
function asistenciaDe(p){
  const regs=regsDe(p.id).filter(r=>r.tipo==="asistencia");const m={};
  (p.equipo||[]).forEach(n=>m[n]={p:0,t:0});
  regs.forEach(r=>(r.asistentes||[]).forEach(a=>{m[a.nombre]=m[a.nombre]||{p:0,t:0};m[a.nombre].t++;if(a.presente)m[a.nombre].p++}));
  return {regs:regs.length,m:m};
}

/* ---------- Clave del área Proyectos ---------- */
const PK_SS="htp_proy_ok";
async function pkHash(c){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("htp-proyectos:"+c));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function pkSet(){return (S.cfg&&S.cfg.claveProy)||""}
function pkOk(h){try{sessionStorage.setItem(PK_SS,h)}catch(e){}}
function pkForget(){try{sessionStorage.removeItem(PK_SS)}catch(e){}}
function projLocked(){const h=pkSet();if(!h)return true;let v="";try{v=sessionStorage.getItem(PK_SS)||""}catch(e){}return v!==h}
const LOCK_SVG='<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function viewProjLock(){
  const h=pkSet();
  let body;
  if(!h&&!S.canEdit)body=`<p class="muted">El jefe de operaciones aún no define la clave de acceso a esta área.</p>`;
  else if(!h)body=`<p class="muted">Crea la clave que se pedirá para entrar a Proyectos. Compártela solo con quienes deban verlos.</p>
    <input class="field" id="pk_new" type="password" autocomplete="new-password" placeholder="Nueva clave (mínimo 4 caracteres)">
    <input class="field" id="pk_new2" type="password" autocomplete="new-password" placeholder="Repite la clave" style="margin-top:8px">
    <button class="btn primary" id="pk_create" style="margin-top:12px;width:100%">Crear clave y entrar</button>`;
  else body=`<p class="muted">Esta área requiere clave.</p>
    <input class="field" id="pk_in" type="password" autocomplete="current-password" placeholder="Clave" autofocus>
    <button class="btn primary" id="pk_go" style="margin-top:12px;width:100%">Entrar</button>`;
  return `<section class="panel lockbox"><div class="lock-ic">${LOCK_SVG}</div><h2>Proyectos</h2>${body}<p class="lock-err" id="pk_err" role="alert"></p></section>`;
}
function pkEnter(){S.view="proj";render();window.scrollTo(0,0);if(S.pendingProj){const id=S.pendingProj;S.pendingProj=null;openProj(id)}}
function bindLock(m){
  const err=t=>{const e=m.querySelector("#pk_err");if(e)e.textContent=t};
  const go=m.querySelector("#pk_go"),inp=m.querySelector("#pk_in");
  if(go){const f=async()=>{const v=inp.value;if(!v){err("Escribe la clave.");return}
      const h=await pkHash(v);if(h===pkSet()){pkOk(h);pkEnter()}else{err("Clave incorrecta.");inp.value="";inp.focus()}};
    go.onclick=f;inp.onkeydown=e=>{if(e.key==="Enter")f()};setTimeout(()=>inp.focus(),50)}
  const cr=m.querySelector("#pk_create");
  if(cr)cr.onclick=async()=>{const a=m.querySelector("#pk_new").value,b=m.querySelector("#pk_new2").value;
    if(a.length<4){err("La clave debe tener al menos 4 caracteres.");return}if(a!==b){err("Las claves no coinciden.");return}
    cr.disabled=true;try{const h=await pkHash(a);const c=JSON.parse(JSON.stringify(S.cfg||DEFAULT_CFG));c.claveProy=h;await saveCfg(c);S.cfg=c;if(draftCfg)draftCfg.claveProy=h;pkOk(h);toast("Clave creada");pkEnter()}catch(e){err(e.message||"No se pudo guardar la clave.")}cr.disabled=false};
  const ch=m.querySelector("#pk_change");
  if(ch)ch.onclick=async()=>{const a=m.querySelector("#pk_c1").value,b=m.querySelector("#pk_c2").value,em=m.querySelector("#pk_cerr");
    if(a.length<4){em.textContent="La clave debe tener al menos 4 caracteres.";return}if(a!==b){em.textContent="Las claves no coinciden.";return}
    ch.disabled=true;try{const h=await pkHash(a);const c=JSON.parse(JSON.stringify(S.cfg||DEFAULT_CFG));c.claveProy=h;await saveCfg(c);S.cfg=c;if(draftCfg)draftCfg.claveProy=h;pkOk(h);toast("Clave de Proyectos actualizada");render()}catch(e){em.textContent=e.message||"No se pudo guardar la clave."}ch.disabled=false};
  const lk=m.querySelector("[data-act=lockproj]");
  if(lk)lk.onclick=()=>{pkForget();S.view="dash";toast("Proyectos bloqueado");render()};
}
function openProj(id){if(projLocked()){S.pendingProj=id;const d=document.getElementById("dlg");if(d.open)d.close();S.view="proj";render();window.scrollTo(0,0);return}openProjRaw(id)}
function openProjRaw(id){S.openId=null;S.openProj=id;S.regF=S.regF||"";const dlg=document.getElementById("dlg");buildProj();if(!dlg.open)dlg.showModal()}
function adjHTML(fotos){
  if(!fotos||!fotos.length)return "";
  return `<div class="thumbs">${fotos.map(f=>{const id=typeof f==="string"?f:f.id;const k=typeof f==="string"?"img":(f.tipo||"img");
    return k==="pdf"?`<button class="file-chip" data-pdf="${esc(id)}">📄 ${esc(f.nombre||"Documento PDF")}</button>`:`<div class="thumb"><img alt="Evidencia" data-ref="${esc(id)}" data-zoom></div>`}).join("")}</div>`;
}
function bindAdj(root){
  hydratePhotos(root);
  root.querySelectorAll("img[data-zoom]").forEach(img=>img.onclick=()=>{if(!img.src)return;const v=document.getElementById("viewer");v.querySelector("img").src=img.src;v.classList.add("on")});
  root.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=async()=>{const src=await photoSrc(b.dataset.pdf);if(!src){toast("No se pudo abrir el PDF",true);return}
    const bin=atob(src.split(",")[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    window.open(URL.createObjectURL(new Blob([u],{type:"application/pdf"})),"_blank")});

    draw();
    const add=()=>{const i=dlg.querySelector("#g_new");const n=i.value.trim();if(!n)return;if(!people.includes(n)){people.push(n);pres[n]=true}i.value="";draw();i.focus()};
    dlg.querySelector("#g_add").onclick=add;dlg.querySelector("#g_new").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
  }else{
    const r=dlg.querySelector("#g_av"),o=dlg.querySelector("#g_out"),on=dlg.querySelector("#g_avon");
    r.oninput=()=>{o.textContent=r.value+"%";on.checked=true};
  }
  const th=dlg.querySelector("#g_th");
  const drawFiles=()=>{th.innerHTML=regFiles.map((f,i)=>f.kind==="pdf"?`<span class="file-chip">📄 ${esc(f.file.name)} <button type="button" data-frm="${i}" aria-label="Quitar ${esc(f.file.name)}">×</button></span>`:`<div class="thumb"><img src="${f.url}" alt="Archivo ${i+1}"><button type="button" data-frm="${i}" aria-label="Quitar archivo ${i+1}">×</button></div>`).join("");
    th.querySelectorAll("[data-frm]").forEach(b=>b.onclick=()=>{const f=regFiles[+b.dataset.frm];if(f.url)URL.revokeObjectURL(f.url);regFiles.splice(+b.dataset.frm,1);drawFiles()})};
  dlg.querySelector("#g_fi").onchange=e=>{for(const f of e.target.files){if(regFiles.length>=8){toast("Máximo 8 archivos por registro",true);break}
      if(f.type==="application/pdf"){if(f.size>650*1024){toast("“"+f.name+"” supera 650 KB. Adjunta una foto en su lugar.",true);continue}regFiles.push({file:f,kind:"pdf"})}
      else if(f.type.startsWith("image/"))regFiles.push({file:f,kind:"img",url:URL.createObjectURL(f)})}
    e.target.value="";drawFiles()};
  dlg.querySelector("[data-gsave]").onclick=async ev=>{
    const err=dlg.querySelector("#g_err"),g=i=>dlg.querySelector(i).value,com=g("#g_co").trim();
    if(!g("#g_fe")){err.textContent="Indica la fecha.";return}
    if(att&&!people.length){err.textContent="Agrega al menos un asistente.";return}
    if(!att&&!com&&!regFiles.length){err.textContent="Escribe una descripción o adjunta al menos un archivo.";return}
    const reg={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),proyecto:pid,tipo:tipo,fecha:g("#g_fe"),por:g("#g_po")||"",comentario:com};
    if(att){reg.asistentes=people.map(n=>({nombre:n,presente:!!pres[n]}));const ac=g("#g_ac").trim();if(ac)reg.actividad=ac}
    else if(dlg.querySelector("#g_avon").checked)reg.avance=+g("#g_av");
    ev.target.disabled=true;ev.target.textContent=regFiles.length?"Subiendo archivos…":"Guardando…";err.textContent="";
    try{await saveRegistro(reg,regFiles);toast(att?"Asistencia registrada":"Evidencia guardada");S.regF="";back()}
    catch(e){err.textContent=e.message||"No se pudo guardar.";ev.target.disabled=false;ev.target.textContent="Guardar registro"}
  };

/* --- Datos de proyectos y registros --- */
function readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("No se pudo leer "+file.name));r.readAsDataURL(file)})}
async function guardarArchivo(ownerId,f){
  const data=f.kind==="pdf"?await readDataURL(f.file):"data:image/jpeg;base64,"+await toB64(f.file);
  if(DEMO){const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{localStorage.setItem("htp_demo_foto_"+id,data)}catch(e){throw new Error("El almacenamiento de este navegador está lleno.")}return id}
  const r=await fdb.collection("fotos").add({tarea:ownerId,data:data,creado:new Date().toISOString(),usuario:S.email||S.nombre||""});return r.id;
}
async function saveRegistro(reg,files){
  const now=new Date().toISOString();reg.creado=now;reg.usuario=S.email||S.nombre||"";reg.fotos=[];
  try{
    for(const f of files){const id=await guardarArchivo(reg.proyecto,f);reg.fotos.push({id:id,tipo:f.kind,nombre:f.kind==="pdf"?f.file.name:""})}
    if(DEMO){const d=demoDB();d.registros.push(reg);demoSave(d)}
    else await fdb.collection("registros").doc(reg.id).set(stripId(reg));
  }catch(e){throw new Error(e.code?fbErr(e):e.message)}
  const i=S.registros.findIndex(x=>x.id===reg.id);if(i>=0)S.registros[i]=reg;else S.registros.push(reg);
  render();
}
async function deleteRegistro(id){
  const r=S.registros.find(x=>x.id===id);if(!r)return;
  const ids=(r.fotos||[]).map(f=>typeof f==="string"?f:f.id);
  if(DEMO){const d=demoDB();d.registros=d.registros.filter(x=>x.id!==id);demoSave(d);ids.forEach(f=>{try{localStorage.removeItem("htp_demo_foto_"+f)}catch(e){}})}
  else{try{const b=fdb.batch();ids.forEach(f=>b.delete(fdb.collection("fotos").doc(f)));b.delete(fdb.collection("registros").doc(id));await b.commit()}catch(e){throw new Error(fbErr(e))}}
  S.registros=S.registros.filter(x=>x.id!==id);render();
}
async function saveProj(n){
  const now=new Date().toISOString();
  const p=Object.assign({},proyOf(n.id)||{creado:now},n,{actualizado:now});
  if(DEMO){const d=demoDB();const i=d.proyectos.findIndex(x=>x.id===p.id);if(i>=0)d.proyectos[i]=p;else d.proyectos.push(p);demoSave(d)}
  else{try{await fdb.collection("proyectos").doc(p.id).set(stripId(p))}catch(e){throw new Error(fbErr(e))}}
  const i=S.proyectos.findIndex(x=>x.id===p.id);if(i>=0)S.proyectos[i]=p;else S.proyectos.push(p);render();
}
async function deleteProj(id){
  const ts=tareasDe(id),rs=S.registros.filter(r=>r.proyecto===id);
  if(DEMO){const d=demoDB();d.proyectos=d.proyectos.filter(x=>x.id!==id);d.registros=d.registros.filter(r=>r.proyecto!==id);d.tareas.forEach(t=>{if(t.proyecto===id)t.proyecto=""});demoSave(d)}
  else{try{
    const ops=[];ts.forEach(t=>ops.push(b=>b.update(fdb.collection("tareas").doc(t.id),{proyecto:""})));
    rs.forEach(r=>{(r.fotos||[]).forEach(f=>{const fid=typeof f==="string"?f:f.id;ops.push(b=>b.delete(fdb.collection("fotos").doc(fid)))});ops.push(b=>b.delete(fdb.collection("registros").doc(r.id)))});
    ops.push(b=>b.delete(fdb.collection("proyectos").doc(id)));
    for(let i=0;i<ops.length;i+=450){const b=fdb.batch();ops.slice(i,i+450).forEach(f=>f(b));await b.commit()}
  }catch(e){throw new Error(fbErr(e))}}
  S.proyectos=S.proyectos.filter(x=>x.id!==id);S.registros=S.registros.filter(r=>r.proyecto!==id);S.tareas.forEach(t=>{if(t.proyecto===id)t.proyecto=""});render();
}

      <label for="tn${i}">Nombre del turno</label><input class="field" id="tn${i}" data-tf="nombre" data-i="${i}" value="${esc(t.nombre)}"${ro?" disabled":""}></div></div>
      <label for="tj${i}">Jefe de turno</label><input class="field" id="tj${i}" data-tf="jefe" data-i="${i}" value="${esc(t.jefe)}" placeholder="Nombre y apellido"${ro?" disabled":""}>
      <label for="tc${i}">Correo del jefe (opcional)</label><input class="field" id="tc${i}" type="email" data-tf="correo" data-i="${i}" value="${esc(t.correo||"")}" placeholder="correo@empresa.cl"${ro?" disabled":""}>
      <label>Operadores mantenedores</label>
      ${t.operadores.map((o,j)=>`<div class="op-row"><input class="field" aria-label="Operador ${j+1}" data-op="${j}" data-i="${i}" value="${esc(o)}" placeholder="Operador ${j+1}"${ro?" disabled":""}>${!ro&&t.operadores.length>2?`<button class="icon-btn" data-rmop="${j}" data-i="${i}" aria-label="Quitar operador ${j+1}">×</button>`:""}</div>`).join("")}
      ${!ro&&t.operadores.length<4?`<button class="btn ghost" data-addop="${i}">${ico("plus")}Agregar operador</button>`:""}
    </section>`;
  });
  h+=`</div>`;
  if(S.canEdit)h+=`<section class="panel" style="margin-top:14px"><h3 style="margin:0 0 4px">Clave del área Proyectos</h3><p class="muted" style="margin:0 0 6px">${pkSet()?"Hay una clave activa. Al cambiarla, todos deberán ingresar la nueva.":"Aún no hay clave: nadie puede entrar a Proyectos hasta que la crees."}</p>
    <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><input class="field" id="pk_c1" type="password" autocomplete="new-password" placeholder="${pkSet()?"Nueva clave":"Clave"}"><input class="field" id="pk_c2" type="password" autocomplete="new-password" placeholder="Repite la clave"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="pk_change">${pkSet()?"Cambiar clave":"Crear clave"}</button>${pkSet()&&!projLocked()?`<button class="btn" data-act="lockproj">Bloquear Proyectos ahora</button>`:""}</div><p class="lock-err" id="pk_cerr" role="alert"></p></section>`;
  if(!DEMO)h+=`<section class="panel" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">${S.canEdit?`<span>Sesión: <b>${esc(S.email)}</b> (administrador)</span><button class="btn" data-act="logout">Cerrar sesión</button>`:`<span>Ingresaste como <b>${esc(S.nombre||S.email)}</b> (jefe de turno)</span><button class="btn" data-act="chguser">Cambiar de usuario</button>`}</section>`;
  return h;
}

/* ---------- Eventos de vistas ---------- */
function bindView(m){
  m.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",()=>openDetail(el.dataset.open,el.dataset.focus));
    if(el.tagName==="TR"||el.tagName==="ARTICLE")el.addEventListener("keydown",e=>{if(e.key==="Enter")openDetail(el.dataset.open)});
  });
  m.querySelectorAll("[data-act=new]").forEach(b=>b.onclick=()=>openForm(null));
  m.querySelectorAll("[data-act=newproj]").forEach(b=>b.onclick=()=>openProjForm(null));
  m.querySelectorAll("[data-proj]").forEach(el=>{el.addEventListener("click",()=>openProj(el.dataset.proj));el.addEventListener("keydown",e=>{if(e.key==="Enter")openProj(el.dataset.proj)})});
  m.querySelectorAll("[data-act=xlsx]").forEach(b=>b.onclick=exportXlsx);
  bindLock(m);
  m.querySelectorAll("[data-goview]").forEach(b=>b.onclick=e=>{e.stopPropagation();S.view=b.dataset.goview;render()});
  m.querySelectorAll("[data-goturno]").forEach(b=>b.onclick=()=>{S.f={q:"",turno:b.dataset.goturno,estado:"",soloVencidas:false};S.view="list";render()});
  const fq=m.querySelector("#fq");
  if(fq){
    fq.oninput=()=>{S.f.q=fq.value;const pos=fq.selectionStart;render();const n=document.getElementById("fq");n.focus();n.setSelectionRange(pos,pos)};
    m.querySelector("#ft").onchange=e=>{S.f.turno=e.target.value;render()};
    m.querySelectorAll("[data-chip]").forEach(c=>c.onclick=()=>{const v=c.dataset.chip;if(v==="__late"){S.f.soloVencidas=!S.f.soloVencidas;S.f.estado=""}else{S.f.estado=v;S.f.soloVencidas=false}render()});
    m.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(S.sort.k===k)S.sort.dir*=-1;else S.sort={k,dir:1};render()});
  }
  m.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.miTurno=b.dataset.pick;lsSet("htp_mi_turno",S.miTurno);render()});
  // equipo
  m.querySelectorAll("[data-tf]").forEach(inp=>inp.oninput=()=>{draftCfg.turnos[+inp.dataset.i][inp.dataset.tf]=inp.value});
  m.querySelectorAll("[data-op]").forEach(inp=>inp.oninput=()=>{draftCfg.turnos[+inp.dataset.i].operadores[+inp.dataset.op]=inp.value});
  m.querySelectorAll("[data-addop]").forEach(b=>b.onclick=()=>{draftCfg.turnos[+b.dataset.addop].operadores.push("");render()});
  m.querySelectorAll("[data-rmop]").forEach(b=>b.onclick=()=>{draftCfg.turnos[+b.dataset.i].operadores.splice(+b.dataset.rmop,1);render()});
  const lo=m.querySelector("[data-act=logout]");if(lo)lo.onclick=()=>{if(confirm("¿Cerrar sesión en este dispositivo?"))logout()};
  const cu=m.querySelector("[data-act=chguser]");if(cu)cu.onclick=()=>{if(confirm("¿Salir y elegir otro nombre?"))changeUser()};
  const st=m.querySelector("[data-act=saveteam]");
  if(st)st.onclick=async()=>{st.disabled=true;try{await saveCfg(JSON.parse(JSON.stringify(draftCfg)));toast("Equipo guardado")}catch(e){toast(e.message||"No se pudo guardar el equipo.",true)}st.disabled=false};
}

/* ---------- Formulario de tarea ---------- */
function openForm(id,preset){
  const t=id?S.tareas.find(x=>x.id===id):null;const cfg=S.cfg||DEFAULT_CFG;
  const d=t||{titulo:"",descripcion:"",turno:cfg.turnos[0].id,responsable:"",prioridad:"Media",fechaInicio:hoy(),fechaCompromiso:addDays(hoy(),7),estado:"Pendiente",avance:0,proyecto:""};
  if(!t&&preset)Object.assign(d,preset);
  const dlg=document.getElementById("dlg");S.openId=null;S.openProj=null;
  const respOpts=()=>{const p=d.proyecto?personasProy(d.proyecto):personas(d.turno);return `<option value="">Sin asignar</option>`+p.map(n=>`<option${d.responsable===n?" selected":""}>${esc(n)}</option>`).join("")+(d.responsable&&!p.includes(d.responsable)?`<option selected>${esc(d.responsable)}</option>`:"")};
  dlg.innerHTML=`<div class="dlg-head"><div style="flex:1"><h3>${t?"Editar tarea":"Nueva tarea"}</h3><div class="sub">${t?"Los cambios quedan visibles para todos los turnos.":"Asigna la tarea a un turno y define el compromiso de cierre."}</div></div><button class="close" data-close aria-label="Cerrar">×</button></div>
  <div class="dlg-body"><div class="grid2">
    <div class="fl full"><label for="f_ti">Tarea</label><input class="field" id="f_ti" required maxlength="140" value="${esc(d.titulo)}" placeholder="Ej.: Cambio de rodillos correa CT-3"></div>
    <div class="fl full"><label for="f_de">Descripción</label><textarea class="field" id="f_de" placeholder="Alcance, ubicación, recursos o criterios de cierre">${esc(d.descripcion)}</textarea></div>
    <div class="fl full"><label for="f_pj">Proyecto <span class="muted">(si eliges uno, la tarea se verá en Proyectos y no en la planilla)</span></label><select class="field" id="f_pj"><option value="">Sin proyecto</option>${S.proyectos.filter(p=>p.estado!=="Cerrado"||p.id===d.proyecto).map(p=>`<option value="${esc(p.id)}"${d.proyecto===p.id?" selected":""}>${esc(p.nombre)}</option>`).join("")}</select></div>
    <div class="fl"><label for="f_tu">Turno <span class="muted" id="f_tuh">${d.proyecto?"(opcional)":""}</span></label><select class="field" id="f_tu"><option value="" id="f_tu0"${d.turno?"":" selected"}${d.proyecto?"":" hidden disabled"}>Sin turno</option>${cfg.turnos.map(x=>`<option value="${esc(x.id)}"${d.turno===x.id?" selected":""}>${esc(x.nombre)}${x.jefe?" ("+esc(x.jefe)+")":""}</option>`).join("")}</select></div>
    <div class="fl"><label for="f_re">Responsable <span class="muted" id="f_reh">${d.proyecto?"(del equipo del proyecto)":""}</span></label><select class="field" id="f_re">${respOpts()}</select></div>
    <div class="fl"><label for="f_fi">Fecha de inicio</label><input class="field" type="date" id="f_fi" value="${esc(d.fechaInicio)}"></div>
    <div class="fl"><label for="f_fc">Fecha de cierre comprometida</label><input class="field" type="date" id="f_fc" value="${esc(d.fechaCompromiso)}"></div>
    <div class="fl"><label for="f_pr">Prioridad</label><select class="field" id="f_pr">${PRIOS.map(p=>`<option${d.prioridad===p?" selected":""}>${p}</option>`).join("")}</select></div>
    ${t?`<div class="fl"><label for="f_es">Estado</label><select class="field" id="f_es">${ESTADOS.map(e=>`<option${d.estado===e?" selected":""}>${e}</option>`).join("")}</select></div>`:""}
  </div>
  <p class="hint" id="f_err" role="alert"></p>
  <div class="dlg-actions">${t?`<button class="btn ghost" data-del style="margin-right:auto;color:var(--st-det)">Eliminar tarea</button>`:""}<button class="btn" data-close>Cancelar</button><button class="btn primary" data-save>${t?"Guardar cambios":"Crear tarea"}</button></div></div>`;
  dlg.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close());
  dlg.querySelector("#f_tu").onchange=e=>{d.turno=e.target.value;if(!d.proyecto){d.responsable="";dlg.querySelector("#f_re").innerHTML=respOpts()}};
  dlg.querySelector("#f_pj").onchange=e=>{d.proyecto=e.target.value;const cur=dlg.querySelector("#f_re").value;
    const ok=d.proyecto?personasProy(d.proyecto):personas(d.turno);d.responsable=ok.includes(cur)?cur:"";
    dlg.querySelector("#f_re").innerHTML=respOpts();
    const o=dlg.querySelector("#f_tu0"),tu=dlg.querySelector("#f_tu");
    if(d.proyecto){o.hidden=false;o.disabled=false}else{o.hidden=true;o.disabled=true;if(!tu.value){tu.value=cfg.turnos[0].id;d.turno=tu.value;d.responsable="";dlg.querySelector("#f_re").innerHTML=respOpts()}}
    dlg.querySelector("#f_tuh").textContent=d.proyecto?"(opcional)":"";dlg.querySelector("#f_reh").textContent=d.proyecto?"(del equipo del proyecto)":""};
  const del=dlg.querySelector("[data-del]");
  if(del)del.onclick=async()=>{if(!confirm("¿Eliminar esta tarea y su historial? No se puede deshacer."))return;try{await deleteTask(t.id);dlg.close();toast("Tarea eliminada")}catch(e){toast(e.message||"No se pudo eliminar la tarea.",true)}};
  dlg.querySelector("[data-save]").onclick=async ev=>{
    const g=i=>dlg.querySelector(i).value;
    const err=dlg.querySelector("#f_err");
    if(!g("#f_ti").trim()){err.textContent="Escribe el nombre de la tarea.";dlg.querySelector("#f_ti").focus();return}
    if(!g("#f_pj")&&!g("#f_tu")){err.textContent="Elige un turno o asigna la tarea a un proyecto.";return}
    if(!g("#f_fc")){err.textContent="Indica la fecha de cierre comprometida.";return}
    if(g("#f_fi")&&g("#f_fc")<g("#f_fi")){err.textContent="La fecha de compromiso no puede ser anterior al inicio.";return}
    const n=t?JSON.parse(JSON.stringify(t)):{id:newId(),creado:new Date().toISOString(),estado:"Pendiente",avance:0,historial:[],ultimoComentario:"",fechaCierre:""};
    n.titulo=g("#f_ti").trim();n.descripcion=g("#f_de").trim();n.turno=g("#f_tu");n.responsable=g("#f_re");n.fechaInicio=g("#f_fi");n.fechaCompromiso=g("#f_fc");n.prioridad=g("#f_pr");n.proyecto=g("#f_pj");
    if(t){const ne=g("#f_es");if(ne!==n.estado){n.estado=ne;if(ne==="Completada"){n.avance=100;n.fechaCierre=n.fechaCierre||hoy()}else n.fechaCierre=""}}
    ev.target.disabled=true;
    try{await saveTask(n);dlg.close();toast(t?"Cambios guardados":"Tarea creada");if(!t)S.openId=null}catch(e){err.textContent=e.message||"No se pudo guardar.";ev.target.disabled=false}
  };
  if(!dlg.open)dlg.showModal();
  setTimeout(()=>dlg.querySelector("#f_ti").focus(),30);
}

/* ---------- Detalle + reporte de avance ---------- */
let pending=[];// fotos por subir {file,url}
function openDetail(id,focus){S.openId=id;S.openProj=null;pending=[];const dlg=document.getElementById("dlg");buildDetail();if(!dlg.open)dlg.showModal();if(focus==="report")setTimeout(()=>{const r=dlg.querySelector("#r_av");if(r)r.focus()},40)}
function refreshDetail(){
  // Mantiene lo que el usuario está escribiendo si llega un cambio de otro usuario
  const dlg=document.getElementById("dlg");if(!dlg.querySelector("[data-detail]"))return;
  const keep={av:dlg.querySelector("#r_av")?.value,es:dlg.querySelector("#r_es")?.value,co:dlg.querySelector("#r_co")?.value,po:dlg.querySelector("#r_po")?.value};
  buildDetail(keep);
}
function buildDetail(keep){
  const dlg=document.getElementById("dlg");const t=S.tareas.find(x=>x.id===S.openId);
  if(!t){dlg.innerHTML=`<div class="dlg-head"><h3>Tarea no disponible</h3><button class="close" data-close aria-label="Cerrar">×</button></div><div class="dlg-body"><p class="muted">Esta tarea fue eliminada.</p></div>`;dlg.querySelector("[data-close]").onclick=()=>dlg.close();return}
  const F=folios(),tr=turnoOf(t.turno);const hist=[...(t.historial||[])].reverse();
  const av=keep&&keep.av!=null?keep.av:(t.avance||0);const es=keep&&keep.es?keep.es:(t.estado==="Pendiente"?"En proceso":t.estado);
  const gente=proyOf(t.proyecto)?[...new Set([...personasProy(t.proyecto),...personas(t.turno)])]:personas(t.turno);
  const diasRest=t.fechaCompromiso?diasEntre(hoy(),t.fechaCompromiso):null;
  dlg.innerHTML=`<div data-detail></div><div class="dlg-head"><div style="flex:1"><h3>N° ${F[t.id]}. ${esc(t.titulo)}</h3><div class="sub">${proyOf(t.proyecto)?"Proyecto "+esc(proyOf(t.proyecto).nombre)+(t.turno?" · ":""):""}${!t.turno&&proyOf(t.proyecto)?"":esc(turnoNombre(t.turno))}${tr&&tr.jefe?", jefe "+esc(tr.jefe):""}</div></div>
    ${S.canEdit?`<button class="btn" data-edit>Editar</button>`:""}<button class="close" data-close aria-label="Cerrar">×</button></div>
  <div class="dlg-body">
    <div class="facts">
      <div>Estado<b>${pill(t)}</b></div>
      <div>Avance<b>${bar(t.avance)}</b></div>
      <div>Responsable<b>${esc(t.responsable||"Sin asignar")}</b></div>
      ${t.proyecto&&proyOf(t.proyecto)?`<div>Proyecto<b><button class="linkbtn" data-goproj="${esc(t.proyecto)}" style="font-size:14px">${esc(proyOf(t.proyecto).nombre)}</button></b></div>`:""}
      <div>Prioridad<b>${esc(t.prioridad||"—")}</b></div>
      <div>Inicio<b>${fmtD(t.fechaInicio)}</b></div>
      <div>Compromiso<b style="${vencida(t)?"color:var(--late)":""}">${fmtD(t.fechaCompromiso)}${t.estado!=="Completada"&&diasRest!=null?` <span class="muted">(${diasRest<0?Math.abs(diasRest)+" d de atraso":diasRest===0?"hoy":"quedan "+diasRest+" d"})</span>`:""}</b></div>
      ${t.fechaCierre?`<div>Cierre real<b>${fmtD(t.fechaCierre)}</b></div>`:""}
    </div>
    ${t.descripcion?`<p class="desc">${esc(t.descripcion)}</p>`:""}
    ${S.canWrite?`<section class="report" aria-labelledby="rep_h"><h4 id="rep_h">Registrar avance</h4>
      <div class="fl"><label for="r_av">Porcentaje de avance</label>
        <div class="range-row"><input type="range" id="r_av" min="0" max="100" step="5" value="${esc(av)}"><output id="r_out">${esc(av)}%</output></div>
        <div class="quick">${[25,50,75,100].map(v=>`<button type="button" data-q="${v}">${v}%</button>`).join("")}</div></div>
      <div class="grid2" style="margin-top:12px">
        <div class="fl"><label for="r_es">Estado del proceso</label><select class="field" id="r_es">${ESTADOS.map(e=>`<option${es===e?" selected":""}>${e}</option>`).join("")}</select></div>
        <div class="fl"><label for="r_po">Reportado por</label><select class="field" id="r_po">${(gente.length?gente:[""]).map(n=>`<option${(keep?keep.po===n:n===S.nombre)?" selected":""} value="${esc(n)}">${esc(n||"Sin nombre en Equipo")}</option>`).join("")}</select></div>
        <div class="fl full"><label for="r_co">Comentario</label><textarea class="field" id="r_co" placeholder="Qué se hizo, qué falta, repuestos o apoyo requerido">${esc(keep&&keep.co||"")}</textarea></div>
        <div class="fl full"><label class="photo-drop" for="r_ph">${ico("cam")} Agregar fotos (cámara o galería)</label><input type="file" id="r_ph" accept="image/*" multiple class="sr">
          <div class="thumbs" id="r_th"></div></div>
      </div>
      <p class="hint" id="r_err" role="alert"></p>
      <div class="dlg-actions" style="margin-top:8px"><button class="btn primary" data-report>Guardar avance</button></div>
    </section>`:""}
    <h4 style="margin:4px 0 12px;font-size:15px">Historial</h4>
    ${hist.length?`<ul class="hist">${hist.map(x=>`<li><div class="h-meta">${fmtDT(x.t)}${x.por?", "+esc(x.por):""}</div>
      <div class="h-line">${esc(x.estado)} al ${x.avance}%</div>${x.comentario?`<p class="h-c">${esc(x.comentario)}</p>`:""}
      ${x.fotos&&x.fotos.length?`<div class="thumbs">${x.fotos.map(f=>`<div class="thumb"><img alt="Foto del avance" data-ref="${esc(f)}" data-zoom></div>`).join("")}</div>`:""}</li>`).join("")}</ul>`:`<p class="empty">Sin reportes aún. El primer avance registrado aparecerá aquí.</p>`}
  </div>`;
  dlg.querySelector("[data-close]").onclick=()=>{dlg.close()};
  const eb=dlg.querySelector("[data-edit]");if(eb)eb.onclick=()=>openForm(t.id);
  const gp=dlg.querySelector("[data-goproj]");if(gp)gp.onclick=()=>openProj(gp.dataset.goproj);
  hydratePhotos(dlg);
  dlg.querySelectorAll("img[data-zoom]").forEach(img=>img.onclick=()=>{if(!img.src)return;const v=document.getElementById("viewer");v.querySelector("img").src=img.src;v.classList.add("on")});
  if(!S.canWrite)return;
  const r=dlg.querySelector("#r_av"),o=dlg.querySelector("#r_out"),se=dlg.querySelector("#r_es");
  r.oninput=()=>{o.textContent=r.value+"%";if(+r.value===100)se.value="Completada";else if(se.value==="Completada")se.value="En proceso"};
  dlg.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{r.value=b.dataset.q;r.oninput()});
  se.onchange=()=>{if(se.value==="Completada"){r.value=100;o.textContent="100%"}};
  const th=dlg.querySelector("#r_th");
  const drawPending=()=>{th.innerHTML=pending.map((p,i)=>`<div class="thumb"><img src="${p.url}" alt="Foto por subir ${i+1}"><button data-rm="${i}" aria-label="Quitar foto ${i+1}">×</button></div>`).join("");th.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{URL.revokeObjectURL(pending[+b.dataset.rm].url);pending.splice(+b.dataset.rm,1);drawPending()})};
  drawPending();
  dlg.querySelector("#r_ph").onchange=e=>{for(const f of e.target.files){if(!f.type.startsWith("image/"))continue;if(pending.length>=6){toast("Máximo 6 fotos por reporte",true);break}pending.push({file:f,url:URL.createObjectURL(f)})}e.target.value="";drawPending()};
  dlg.querySelector("[data-report]").onclick=async ev=>{
    const err=dlg.querySelector("#r_err");const com=dlg.querySelector("#r_co").value.trim();
    const nuevoAv=+r.value,nuevoEs=se.value;
    if(!com&&!pending.length&&nuevoAv===(+t.avance||0)&&nuevoEs===t.estado){err.textContent="Cambia el avance o el estado, o agrega un comentario o una foto.";return}
    ev.target.disabled=true;ev.target.textContent=pending.length?"Subiendo fotos…":"Guardando…";err.textContent="";
    try{
      const fotos=[];for(const p of pending){fotos.push(await toB64(p.file))}
      const tt=await reportar(t.id,{avance:nuevoAv,estado:nuevoEs,comentario:com,por:dlg.querySelector("#r_po").value||""},fotos);
      pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];
      const co=dlg.querySelector("#r_co");if(co)co.value="";
      if(document.activeElement)document.activeElement.blur();
      upsertLocal(tt);
      toast("Avance guardado");
    }catch(e){err.textContent=e.message||"No se pudo guardar el avance.";ev.target.disabled=false;ev.target.textContent="Guardar avance"}
  };
}

/* ---------- Exportar a Excel ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function exportXlsx(){
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const F=folios();const mk=list=>[...list].sort((a,b)=>F[a.id]-F[b.id]).map(t=>({"N°":F[t.id],"Tarea":t.titulo,"Descripción":t.descripcion||"","Proyecto":(proyOf(t.proyecto)||{}).nombre||"","Turno":turnoNombre(t.turno),"Jefe de turno":(turnoOf(t.turno)||{}).jefe||"","Responsable":t.responsable||"","Prioridad":t.prioridad||"","Fecha inicio":fmtD(t.fechaInicio),"Fecha compromiso":fmtD(t.fechaCompromiso),"Estado":t.estado,"Vencida":vencida(t)?"Sí":"No","Avance %":+t.avance||0,"Fecha cierre real":t.fechaCierre?fmtD(t.fechaCierre):"","Último comentario":t.ultimoComentario||"","N° reportes":(t.historial||[]).length}));
    const rows=mk(sueltas()).map(r=>{delete r["Proyecto"];return r}),rowsP=mk(deProyectos());
    const hist=[];S.tareas.forEach(t=>(t.historial||[]).forEach(h=>hist.push({"N° tarea":F[t.id],"Tarea":t.titulo,"Turno":turnoNombre(t.turno),"Fecha y hora":fmtDT(h.t),"Reportado por":h.por||"","Estado":h.estado,"Avance %":h.avance,"Comentario":h.comentario||"","Fotos":h.fotos?h.fotos.length:0})));
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"N°":"","Tarea":"Sin tareas"}]);ws["!cols"]=[6,40,40,12,22,22,10,14,16,12,9,10,16,50,11].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"Tareas");
    if(rowsP.length){const wq=XLSX.utils.json_to_sheet(rowsP);wq["!cols"]=[6,40,40,26,12,22,22,10,14,16,12,9,10,16,50,11].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wq,"Tareas de proyectos")}
    const wh=XLSX.utils.json_to_sheet(hist.length?hist:[{"N° tarea":"","Tarea":"Sin reportes"}]);wh["!cols"]=[9,40,12,18,22,12,10,60,7].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wh,"Historial");
    if(S.proyectos.length){const wp=XLSX.utils.json_to_sheet(S.proyectos.map(p=>{const s=pStats(p);return {"Proyecto":p.nombre,"Descripción":p.descripcion||"","Responsable":p.responsable||"","Estado":p.estado,"Equipo":(p.equipo||[]).join(", "),"Fecha de ejecución":fmtD(p.fechaInicio),"Fecha de cierre":fmtD(p.fechaTermino),"Atrasado":pLate(p)?"Sí":"No","Avance %":s.avTot,"Tareas":s.total,"Completadas":s.ok,"Vencidas":s.late}}));wp["!cols"]=[34,40,22,14,40,16,14,9,9,8,11,9].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wp,"Proyectos")}
    const pn=id=>(proyOf(id)||{}).nombre||"";
    const asis=[];S.registros.filter(r=>r.tipo==="asistencia").forEach(r=>(r.asistentes||[]).forEach(a=>asis.push({"Fecha":fmtD(r.fecha),"Proyecto":pn(r.proyecto),"Actividad":r.actividad||"","Persona":a.nombre,"Asistencia":a.presente?"Presente":"Ausente","Registrado por":r.por||"","Observaciones":r.comentario||"","Archivos":(r.fotos||[]).length})));
    if(asis.length){const wa=XLSX.utils.json_to_sheet(asis);wa["!cols"]=[12,34,26,26,11,22,40,9].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,wa,"Asistencia")}
    const evs=S.registros.filter(r=>r.tipo==="evidencia").map(r=>({"Fecha":fmtD(r.fecha),"Proyecto":pn(r.proyecto),"Avance informado %":r.avance!=null&&r.avance!==""?+r.avance:"","Descripción":r.comentario||"","Registrado por":r.por||"","Archivos":(r.fotos||[]).length}));
    if(evs.length){const we=XLSX.utils.json_to_sheet(evs);we["!cols"]=[12,34,12,60,22,9].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,we,"Evidencias")}
    XLSX.writeFile(wb,"Seguimiento_tareas_turnos_"+hoy()+".xlsx");
  }catch(e){toast("No se pudo generar el Excel.",true)}
}

/* ---------- Iconos ---------- */
function ico(n){const p={plus:'<path d="M12 5v14M5 12h14"/>',down:'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'}[n];return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}

/* ---------- Navegación y arranque ---------- */
document.querySelectorAll(".nav-i").forEach(b=>b.onclick=()=>{if(S.view===b.dataset.view){window.scrollTo({top:0,behavior:"smooth"});return}S.view=b.dataset.view;if(S.view==="team")draftCfg=null;render();window.scrollTo(0,0)});
document.getElementById("fab").onclick=()=>S.view==="proj"?openProjForm(null):openForm(null);
document.getElementById("viewer").onclick=e=>e.currentTarget.classList.remove("on");
document.getElementById("dlg").addEventListener("close",()=>{S.openId=null;S.openProj=null;pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[]});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("viewer").classList.remove("on")});

function setConn(ok,txt){const c=document.getElementById("conn");c.className="conn"+(ok?" ok":"");c.querySelector("span").textContent=txt}
document.getElementById("conn").onclick=()=>toast(DEMO?"Modo demostración: datos solo en este navegador":S.loaded?"Conectado: los cambios se ven al instante":"Sin conexión con Firebase");
document.addEventListener("focusout",()=>setTimeout(()=>{if(!S.pendingRender)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;S.pendingRender=false;render()},60));

function softRender(){
  const a=document.activeElement,dlg=document.getElementById("dlg");
  const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&(document.getElementById("main").contains(a)||dlg.contains(a));
  if(typing)S.pendingRender=true;else render();
}
function addScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("No se pudo cargar Firebase. Revisa tu conexión."));document.head.appendChild(s)})}
function startData(){
  unsubs.forEach(u=>u());unsubs=[];
  let a=false,b=false,c=false,e4=false;
  const fail=e=>{S.loaded=false;S.loadErr=(e&&e.code==="permission-denied")?(S.email?"Tu correo ("+S.email+") no tiene acceso de administrador.":"Firebase rechazó el acceso. El jefe de operaciones debe publicar las reglas nuevas en Firebase (ver instructivo)."):fbErr(e);setConn(false,"Sin acceso");render()};
  const done=()=>{
    if(!(a&&b&&c&&e4))return;
    const first=!S.loaded;S.loaded=true;S.loadErr="";setConn(true,"En línea");
    if(first&&!S.canEdit&&S.cfg){
      if(S.email&&!S.nombre){const tr=(S.cfg.turnos||[]).find(t=>t.correo===S.email);if(tr&&tr.jefe){S.nombre=tr.jefe;usrSet({nombre:tr.jefe,turno:tr.id})}}
      const sv=usrGet();if(sv&&S.nombre){const j=jefesLista().find(x=>x.nombre===S.nombre)||jefesLista().find(x=>x.id===sv.turno&&x.nombre);
        if(j){S.nombre=j.nombre;S.miTurno=j.id;lsSet("htp_mi_turno",j.id);usrSet({nombre:j.nombre,turno:j.id});S.view="mine"}else{S.nombre="";usrSet(null)}}}
    if(first)render();else softRender();
  };
  unsubs.push(fdb.doc("config/equipo").onSnapshot(s=>{S.cfg=s.exists?s.data():DEFAULT_CFG;a=true;done()},fail));
  unsubs.push(fdb.collection("registros").onSnapshot(s=>{S.registros=s.docs.map(d=>Object.assign({id:d.id},d.data()));e4=true;done()},e=>{S.registros=[];S.projErr=true;e4=true;done()}));
  unsubs.push(fdb.collection("proyectos").onSnapshot(s=>{S.proyectos=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.projErr=false;c=true;done()},e=>{S.proyectos=[];S.projErr=true;c=true;done()}));
  unsubs.push(fdb.collection("tareas").onSnapshot(s=>{S.tareas=s.docs.map(d=>Object.assign({id:d.id},d.data()));b=true;done()},fail));
}
(async function init(){
  if(DEMO){const d=demoDB();S.cfg=d.cfg||DEFAULT_CFG;S.tareas=d.tareas;S.proyectos=d.proyectos||[];S.registros=d.registros||[];S.loaded=true;setConn(false,"Demostración");render();return}
  render();
  const FB="https://www.gstatic.com/firebasejs/10.12.2/";
  try{await addScript(FB+"firebase-app-compat.js");await addScript(FB+"firebase-auth-compat.js");await addScript(FB+"firebase-firestore-compat.js")}
  catch(e){S.loadErr=e.message;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);fauth=firebase.auth();fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const admins=ADMIN_EMAILS.map(x=>String(x).trim().toLowerCase());
  fauth.onAuthStateChanged(u=>{
    unsubs.forEach(x=>x());unsubs=[];
    if(!u&&!S.wantAdmin){pkForget();S.needLogin=false;S.email="";S.canEdit=false;S.loaded=false;S.loadErr="";render();anonIn();return}
    if(!u){pkForget();S.needLogin=true;S.email="";S.rol="";S.canEdit=false;S.loaded=false;S.loadErr="";S.tareas=[];S.proyectos=[];S.registros=[];S.view="dash";const d=document.getElementById("dlg");if(d.open)d.close();render();return}
    S.needLogin=false;S.wantAdmin=false;S.email=u.isAnonymous?"":(u.email||"").toLowerCase();S.canEdit=!!S.email&&admins.indexOf(S.email)>=0;S.rol=S.canEdit?"admin":"turno";
    if(!S.canEdit){const sv=usrGet();S.nombre=sv&&sv.nombre?sv.nombre:""}else S.nombre="";
    S.loaded=false;S.loadErr="";render();startData();
  });
})();
})();
